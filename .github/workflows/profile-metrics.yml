name: Refresh public profile data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *" # 09:17 America/Fortaleza
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - "assets/lex-profile/activity-v4*.svg"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: read

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify data filtering and SVG rendering
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public data
        env:
          PROFILE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py --write
      - name: Publish changed panels
        run: |
          if git diff --quiet -- assets/lex-profile/activity-v4.svg assets/lex-profile/activity-v4-mobile.svg; then
            echo "Public data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/lex-profile/activity-v4.svg assets/lex-profile/activity-v4-mobile.svg
          git commit -m "chore: refresh public profile data"
          git push
