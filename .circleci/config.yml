version: 2.1
parameters:
  publish_profile:
    type: boolean
    default: true
jobs:
  refresh:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test public-data filtering and generate both panels
          command: |
            python3 -m unittest discover -s scripts -p 'test_*.py'
            python3 scripts/update_profile.py --write
      - store_artifacts:
          path: assets/lex-profile/activity-v4.svg
      - store_artifacts:
          path: assets/lex-profile/activity-v4-mobile.svg
      - persist_to_workspace:
          root: .
          paths:
            - assets/lex-profile/activity-v4.svg
            - assets/lex-profile/activity-v4-mobile.svg
  publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/profile-result
      - run:
          name: Publish only the two generated panels against current main
          command: python3 scripts/ci/publish-profile.py /tmp/profile-result
workflows:
  profile:
    jobs:
      - refresh
      - publish:
          requires: [refresh]
          serial-group: << pipeline.project.slug >>/profile-refresh
          filters:
            branches:
              only: main
          pre-steps:
            - when:
                condition:
                  not: << pipeline.parameters.publish_profile >>
                steps:
                  - run: circleci-agent step halt
